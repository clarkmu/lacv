    <path class="rel" d="M 900 386 C 835.0 386, 835.0 128.0, 770 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 1200 527 C 1271.92 527, 1271.92 128.0, 1200 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 900 548 C 835.0 548, 835.0 128.0, 770 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 900 710 C 835.0 710, 835.0 128.0, 770 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 1200 731 C 1288.24 731, 1288.24 128.0, 1200 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 900 914 C 835.0 914, 835.0 128.0, 770 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 1200 935 C 1265.0 935, 1265.0 431.0, 1330 431.0" marker-end="url(#arrow)"/>
