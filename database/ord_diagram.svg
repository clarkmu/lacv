    <path class="rel" d="M 900 1139 C 835.0 1139, 835.0 128.0, 770 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 900 1280 C 835.0 1280, 835.0 128.0, 770 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 1200 1301 C 1275.28 1301, 1275.28 860.0, 1200 860.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 1630 485 C 1687.28 485, 1687.28 269.0, 1630 269.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 1330 788 C 1265.0 788, 1265.0 860.0, 1200 860.0" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(60 110)">
    <rect class="table" width="300" height="149" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">batches</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK batch_id BIGINT</text>
    <text class="field" x="12" y="72">batch_code VARCHAR(50) UNIQUE</text>
    <text class="field" x="12" y="93">batch_name VARCHAR(255)</text>
    <text class="field" x="12" y="114">description TEXT</text>
    <text class="field" x="12" y="135">is_active BOOLEAN</text>
  </g>
  <g transform="translate(60 293)">
    <rect class="table" width="300" height="149" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">sample_types</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK sample_type_id BIGINT</text>
    <text class="field" x="12" y="72">type_code VARCHAR(100) UNIQUE</text>
    <text class="field" x="12" y="93">type_name VARCHAR(150)</text>
    <text class="field" x="12" y="114">is_active BOOLEAN</text>
    <text class="field" x="12" y="135">sort_order INTEGER</text>
  </g>
  <g transform="translate(60 476)">
    <rect class="table" width="300" height="149" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">storage_locations</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK storage_location_id BIGINT</text>
    <text class="field" x="12" y="72">FK parent_location_id</text>
    <text class="field" x="12" y="93">location_code VARCHAR(100)</text>
    <text class="field" x="12" y="114">location_type VARCHAR(50)</text>
    <text class="field" x="12" y="135">location_name VARCHAR(255)</text>
  </g>
  <g transform="translate(60 659)" class="event">
    <rect class="table" width="300" height="170" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">storage_events</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK storage_event_id BIGINT</text>
    <text class="field" x="12" y="72">FK sample_id</text>
    <text class="field" x="12" y="93">FK from_location_id</text>
    <text class="field" x="12" y="114">FK to_location_id</text>
    <text class="field" x="12" y="135">event_type VARCHAR(50)</text>
    <text class="field" x="12" y="156">event_date / operator_name / notes</text>
  </g>
  <g transform="translate(60 863)" class="event">
    <rect class="table" width="300" height="170" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">legacy_material_records</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK legacy_material_id BIGINT</text>
    <text class="field" x="12" y="72">FK sample_id</text>
    <text class="field" x="12" y="93">material_code VARCHAR(120) UNIQUE</text>
    <text class="field" x="12" y="114">resolution matched | new_sample</text>
    <text class="field" x="12" y="135">record JSONB (original row)</text>
    <text class="field" x="12" y="156">migrated_at TIMESTAMPTZ</text>
  </g>
  <g transform="translate(470 110)" class="core">
    <rect class="table" width="300" height="443" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">samples</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK sample_id BIGINT</text>
    <text class="field" x="12" y="72">FK parent_sample_id (lineage)</text>
    <text class="field" x="12" y="93">FK batch_id (root samples only)</text>
    <text class="field" x="12" y="114">FK sample_type_id</text>
    <text class="field" x="12" y="135">FK storage_location_id</text>
    <text class="field" x="12" y="156">sample_code VARCHAR(100) UNIQUE</text>
    <text class="field" x="12" y="177">external_sample_id VARCHAR(100)</text>
    <text class="field" x="12" y="198">label VARCHAR(255)</text>
    <text class="field" x="12" y="219">subtype VARCHAR(100)</text>
    <text class="field" x="12" y="240">status VARCHAR(50)</text>
    <text class="field" x="12" y="261">current_quantity NUMERIC</text>
    <text class="field" x="12" y="282">quantity_unit VARCHAR(50)</text>
    <text class="field" x="12" y="303">concentration NUMERIC</text>
    <text class="field" x="12" y="324">concentration_unit VARCHAR(50)</text>
    <text class="field" x="12" y="345">is_consumed / is_disposed BOOLEAN</text>
    <text class="field" x="12" y="366">source_type / source_description</text>
    <text class="field" x="12" y="387">collection_date / received_date</text>
    <text class="field" x="12" y="408">expiration_date TIMESTAMP</text>
    <text class="field" x="12" y="429">notes TEXT</text>
  </g>
  <g transform="translate(900 110)">
    <rect class="table" width="300" height="170" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">process_events</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK process_event_id BIGINT</text>
    <text class="field" x="12" y="72">FK process_type_id</text>
    <text class="field" x="12" y="93">FK protocol_id</text>
    <text class="field" x="12" y="114">process_code VARCHAR(100) UNIQUE</text>
    <text class="field" x="12" y="135">operator_name / status</text>
    <text class="field" x="12" y="156">started_at / completed_at</text>
  </g>
  <g transform="translate(900 314)" class="junction">
    <rect class="table" width="300" height="128" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">process_event_inputs</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK,FK process_event_id</text>
    <rect class="key" x="1" y="58" width="298" height="21"/>
    <text class="field" x="12" y="72">PK,FK sample_id</text>
    <text class="field" x="12" y="93">quantity_used NUMERIC</text>
    <text class="field" x="12" y="114">quantity_unit VARCHAR(50)</text>
  </g>
  <g transform="translate(900 476)" class="junction">
    <rect class="table" width="300" height="128" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">process_event_outputs</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK,FK process_event_id</text>
    <rect class="key" x="1" y="58" width="298" height="21"/>
    <text class="field" x="12" y="72">PK,FK sample_id</text>
    <text class="field" x="12" y="93">quantity_generated NUMERIC</text>
    <text class="field" x="12" y="114">quantity_unit VARCHAR(50)</text>
  </g>
  <g transform="translate(900 638)" class="event">
    <rect class="table" width="300" height="170" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">sample_quantity_events</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK quantity_event_id BIGINT</text>
    <text class="field" x="12" y="72">FK sample_id</text>
    <text class="field" x="12" y="93">FK related_process_event_id</text>
    <text class="field" x="12" y="114">event_type VARCHAR(50)</text>
    <text class="field" x="12" y="135">quantity_change / before / after</text>
    <text class="field" x="12" y="156">event_date TIMESTAMPTZ</text>
  </g>
  <g transform="translate(900 842)">
    <rect class="table" width="300" height="191" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">assays</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK assay_id BIGINT</text>
    <text class="field" x="12" y="72">FK sample_id</text>
    <text class="field" x="12" y="93">FK assay_definition_id</text>
    <text class="field" x="12" y="114">FK assay_run_id</text>
    <text class="field" x="12" y="135">assay_instance_code UNIQUE</text>
    <text class="field" x="12" y="156">status / qc_status</text>
    <text class="field" x="12" y="177">operator_name / assay_date</text>
  </g>
  <g transform="translate(900 1067)" class="junction">
    <rect class="table" width="300" height="107" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">assay_outputs</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK,FK assay_id</text>
    <rect class="key" x="1" y="58" width="298" height="21"/>
    <text class="field" x="12" y="72">PK,FK sample_id (derived sample)</text>
    <text class="field" x="12" y="93">notes TEXT</text>
  </g>
  <g transform="translate(900 1208)" class="event">
    <rect class="table" width="300" height="149" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">data_files</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK data_file_id BIGINT</text>
    <text class="field" x="12" y="72">FK sample_id</text>
    <text class="field" x="12" y="93">FK assay_id</text>
    <text class="field" x="12" y="114">file_type / file_name</text>
    <text class="field" x="12" y="135">file_location / checksum_sha256</text>
  </g>
  <g transform="translate(1330 110)">
    <rect class="table" width="300" height="107" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">process_types</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK process_type_id BIGINT</text>
    <text class="field" x="12" y="72">type_code VARCHAR(100) UNIQUE</text>
    <text class="field" x="12" y="93">type_name VARCHAR(150)</text>
  </g>
  <g transform="translate(1330 251)">
    <rect class="table" width="300" height="128" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">protocols</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK protocol_id BIGINT</text>
    <text class="field" x="12" y="72">protocol_code / protocol_version</text>
    <text class="field" x="12" y="93">protocol_name VARCHAR(255)</text>
    <text class="field" x="12" y="114">protocol_type process | assay | general</text>
  </g>
  <g transform="translate(1330 413)">
    <rect class="table" width="300" height="128" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">assay_definitions</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK assay_definition_id BIGINT</text>
    <text class="field" x="12" y="72">FK protocol_id</text>
    <text class="field" x="12" y="93">assay_code UNIQUE</text>
    <text class="field" x="12" y="114">assay_name / assay_type / target</text>
  </g>
  <g transform="translate(1330 575)">
    <rect class="table" width="300" height="107" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">assay_runs</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK assay_run_id BIGINT</text>
    <text class="field" x="12" y="72">run_code UNIQUE</text>
    <text class="field" x="12" y="93">instrument / platform / status</text>
  </g>
  <g transform="translate(1330 716)">
    <rect class="table" width="300" height="149" rx="4"/>
    <rect class="head" width="300" height="36" rx="4"/>
    <text class="headtext" x="14" y="24">assay_results</text>
    <rect class="key" x="1" y="37" width="298" height="21"/>
    <text class="field" x="12" y="51">PK assay_result_id BIGINT</text>
    <text class="field" x="12" y="72">FK assay_id</text>
    <text class="field" x="12" y="93">analyte / result_name</text>
    <text class="field" x="12" y="114">numeric_value / text_value / unit</text>
    <text class="field" x="12" y="135">interpretation / qc_status</text>
  </g>
  <text class="legend" x="60" y="1421">Green: samples (core). Slate: lookups and process/assay tables. Steel: join tables. Brown: history, files and legacy provenance. legacy_material_records keeps every retired Material row and its code.</text>
</svg>
