<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="1451" viewBox="0 0 1690 1451" role="img" aria-labelledby="title desc">
  <title id="title">LACV database relational diagram</title>
  <desc id="desc">Entity relationship diagram for the Sample-centric PostgreSQL schema. Sample is the single physical identity and lineage tree; process events, assays, storage and quantity history, and data files all point at samples.</desc>
  <defs>
    <style>
      .canvas { fill: #f5f7fa; }
      .title { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #17212b; }
      .subtitle { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #526170; }
      .table { fill: #ffffff; stroke: #b7c3cf; stroke-width: 1.5; }
      .head { fill: #17324d; }
      .core .head { fill: #0f5c4a; }
      .core .table { stroke: #0f5c4a; stroke-width: 2.5; }
      .junction .head { fill: #39566f; }
      .event .head { fill: #5d4b3f; }
      .key { fill: #e6f1f8; }
      .field { font: 12px ui-monospace,SFMono-Regular,Menlo,monospace; fill: #263746; }
      .headtext { font: 700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #ffffff; }
      .rel { fill: none; stroke: #7890a4; stroke-width: 1.4; opacity: 0.85; }
      .rel-self { fill: none; stroke: #c07945; stroke-width: 2; }
      .arrow { fill: #7890a4; }
      .arrow-self { fill: #c07945; }
      .legend { font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #526170; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/></marker>
    <marker id="arrowSelf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" class="arrow-self"/></marker>
  </defs>
  <rect class="canvas" width="1690" height="1451"/>
  <text class="title" x="60" y="54">LACV database relational diagram</text>
  <text class="subtitle" x="60" y="80">Sample is the single physical identity and lineage tree (orange: samples.parent_sample_id). PK = primary key, FK = foreign key; arrows point to the referenced table.</text>

  <g aria-label="relationships">
    <path class="rel-self" d="M 360 548 C 405 548, 405 494.0, 360 494.0" marker-end="url(#arrowSelf)"/>
    <path class="rel" d="M 360 731 C 415.0 731, 415.0 128.0, 470 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 360 752 C 420.64 752, 420.64 494.0, 360 494.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 360 773 C 422.32 773, 422.32 494.0, 360 494.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 360 935 C 415.0 935, 415.0 128.0, 470 128.0" marker-end="url(#arrow)"/>
    <path class="rel-self" d="M 770 182 C 815 182, 815 128.0, 770 128.0" marker-end="url(#arrowSelf)"/>
    <path class="rel" d="M 470 203 C 415.0 203, 415.0 128.0, 360 128.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 470 224 C 415.0 224, 415.0 311.0, 360 311.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 470 245 C 415.0 245, 415.0 494.0, 360 494.0" marker-end="url(#arrow)"/>
    <path class="rel" d="M 1200 182 C 1265.0 182, 1265.0 128.0, 1330 128.0" marker-end="url(#arrow)"/>
