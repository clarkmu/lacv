services:
  gateway:
    build: ./deploy/gateway
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/gateway/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lacv-dev

  frontend:
    image: node:24-alpine
    working_dir: /app
    # Installs whenever package-lock.json changes (also while running), then runs Vite. See the script.
    command: sh scripts/dev-server.sh
    environment:
      LACV_API_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    expose:
      - "5173"
    depends_on:
      - backend
    networks:
      - lacv-dev

  backend:
    build: ./backend
    working_dir: /app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://lims:lims_dev_password@db:5432/research_sample_tracker
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lacv-dev

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: research_sample_tracker
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: lims_dev_password
    volumes:
      - lacv_dev_postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims -d research_sample_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - lacv-dev

volumes:
  frontend_node_modules:
  lacv_dev_postgres:

networks:
  lacv-dev:
    external: true
    name: lacv-dev
